<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>László Tímea · Environmental Engineer</title>
<meta name="description" content="CV, motivation letter and extra information of László Tímea, environmental engineer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --mist:#EDF2EF; --paper:#FBFCFA; --ink:#12302F; --moss:#2E6B57; --sun:#F0A23B; --tide:#3C8DAD; --line:#CFDAD5; --muted:#586C68;
  --sans:'Bricolage Grotesque',system-ui,sans-serif; --serif:'Newsreader',Georgia,serif;
}
@media (prefers-color-scheme:dark){
  :root{--mist:#0E1F1E; --paper:#142928; --ink:#E6F0EC; --moss:#6FC2A5; --sun:#F4B25A; --tide:#7CC0DB; --line:#2A4442; --muted:#9DB5AF}
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--mist);color:var(--ink);font:400 16px/1.6 var(--sans)}
a{color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px;border-radius:4px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}

/* Hero */
.hero{position:relative;overflow:hidden;background:var(--ink);color:#EDF2EF;padding:56px 0 0}
@media (prefers-color-scheme:dark){.hero{background:#0A1716}}
.topo{position:absolute;inset:0;width:100%;height:100%;opacity:.5;pointer-events:none}
.topo circle{fill:none;stroke:#6FC2A5;stroke-width:1}
.hero .wrap{position:relative}
.hero h1{font-weight:800;font-size:clamp(2.6rem,8vw,5.6rem);line-height:.95;letter-spacing:-.035em;margin:0 0 14px}
.hero p.role{font-size:clamp(1.05rem,2.4vw,1.4rem);margin:0 0 6px;color:#BFD7CE;max-width:34ch}
.hero .pill{display:inline-block;background:var(--sun);color:#12302F;font-weight:600;padding:3px 12px;border-radius:99px;font-size:.88rem;margin-top:10px}

/* Language switch */
.lang{position:absolute;top:-30px;right:20px;display:flex;border:1.5px solid rgba(255,255,255,.3);border-radius:99px;overflow:hidden}
.lang button{appearance:none;border:0;background:transparent;color:#BFD7CE;font:600 .85rem var(--sans);padding:6px 14px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--sun);color:#12302F}

/* Tabs */
.tabs{position:relative;display:flex;gap:4px;margin-top:44px}
.tab{appearance:none;border:0;background:transparent;color:#BFD7CE;font:600 1rem var(--sans);padding:14px 22px;cursor:pointer;border-radius:12px 12px 0 0;transition:background .2s,color .2s}
.tab:hover{color:#fff;background:rgba(255,255,255,.08)}
.tab[aria-selected="true"]{background:var(--mist);color:var(--ink)}
@media (prefers-color-scheme:dark){.tab[aria-selected="true"]{color:var(--ink)}}

/* Panels */
main{padding:40px 0 70px}
.panel[hidden]{display:none}
.panel{animation:swap .35s ease}
@keyframes swap{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h2{font-size:1.5rem;letter-spacing:-.02em;margin:0 0 18px}
h3{font-size:1.05rem;margin:0}
.muted{color:var(--muted)}
.cv{display:grid;grid-template-columns:290px 1fr;gap:36px;align-items:start}
.side{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:24px;position:sticky;top:16px}
.photo{position:relative;width:100%;aspect-ratio:1;border-radius:46% 54% 42% 58%/52% 44% 56% 48%;overflow:hidden;background:var(--line);margin-bottom:12px;border:3px solid var(--sun)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:.9rem;padding:20px}
.photo-actions{display:flex;gap:8px;margin-bottom:20px}
.btn{font:600 .85rem var(--sans);border:1.5px solid var(--moss);background:transparent;color:var(--moss);padding:7px 14px;border-radius:99px;cursor:pointer}
.btn:hover{background:var(--moss);color:var(--paper)}
.btn.ghost{border-color:var(--line);color:var(--muted)}
.side h3{margin:20px 0 8px;font-size:.95rem;color:var(--moss)}
.side ul{list-style:none;margin:0;padding:0;font-size:.93rem}
.side li{padding:3px 0}
.bar{height:6px;border-radius:9px;background:var(--line);margin:3px 0 10px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--moss),var(--tide));border-radius:9px}
.skill{display:flex;justify-content:space-between;font-size:.9rem}

.block{margin-bottom:38px}
.lead{font-family:var(--serif);font-size:1.25rem;line-height:1.55;max-width:60ch}
.timeline{border-left:2px solid var(--moss);margin-left:6px;padding-left:26px}
.job{position:relative;margin-bottom:26px}
.job::before{content:"";position:absolute;left:-35px;top:7px;width:14px;height:14px;border-radius:50%;background:var(--sun);border:3px solid var(--mist)}
.job .when{font-size:.85rem;color:var(--tide);font-weight:600}
.job ul{margin:8px 0 0;padding-left:18px}
.job li{margin:3px 0}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tags span{border:1.5px solid var(--line);background:var(--paper);padding:3px 12px;border-radius:99px;font-size:.88rem}
.edu{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.edu div{background:var(--paper);border-left:5px solid var(--tide);padding:14px 18px;border-radius:4px 14px 14px 4px}

/* Letter */
.letter{max-width:720px;margin:0 auto;background:var(--paper);border:1px solid var(--line);border-radius:6px 28px 6px 28px;padding:clamp(26px,6vw,64px);font-family:var(--serif);font-size:1.15rem;line-height:1.7;text-align:justify}
.letter p{margin:0 0 1.1em}
.letter .meta{font-family:var(--sans);font-size:.9rem;color:var(--muted)}
.letter .sig{font-family:var(--serif);font-style:italic;font-size:1.5rem;margin-top:1.4em}

.profile p{text-align:justify}

/* Info */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:22px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:24px}
.card.wide{grid-column:1/-1;background:var(--moss);color:#fff;border:0}
.card.wide .muted{color:#D5EBE2}
.card h2{font-size:1.2rem}
.card ul{margin:0;padding-left:18px}
.card li{margin:6px 0}
.stats{display:flex;gap:30px;flex-wrap:wrap}
.stats b{display:block;font-size:2.4rem;font-weight:800;letter-spacing:-.03em;line-height:1}

footer{border-top:1px solid var(--line);padding:22px 0;color:var(--muted);font-size:.88rem}

@media (max-width:820px){
  .cv{grid-template-columns:1fr}
  .side{position:static}
  .photo{max-width:240px;margin-inline:auto}
  .tab{padding:12px 14px;font-size:.93rem}
}
@media print{.hero .tabs,.photo-actions,footer{display:none}.panel[hidden]{display:none}body{background:#fff}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}html{scroll-behavior:auto}}
</style>
</head>
<body>

<header class="hero">
  <svg class="topo" aria-hidden="true" viewBox="0 0 1200 420" preserveAspectRatio="xMidYMid slice">
    <defs><filter id="warp"><feTurbulence type="fractalNoise" baseFrequency=".004 .009" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="150"/></filter></defs>
    <g filter="url(#warp)" transform="translate(880 200)">
      <circle r="40"/><circle r="85"/><circle r="130"/><circle r="175"/><circle r="220"/><circle r="265"/><circle r="310"/><circle r="355"/><circle r="400"/><circle r="445"/>
    </g>
  </svg>
  <div class="wrap">
    <div class="lang" role="group" aria-label="Nyelv / Language">
      <button type="button" data-l="hu" aria-pressed="true">HU</button>
      <button type="button" data-l="en" aria-pressed="false">EN</button>
    </div>
    <h1>László<br>Tímea</h1>
    <p class="role" data-t="role"></p>
    <span class="pill" data-t="status"></span>
    <div class="tabs" role="tablist" id="tablist">
      <button class="tab" role="tab" id="t-cv" aria-controls="cv" aria-selected="true" data-t="tabCv"></button>
      <button class="tab" role="tab" id="t-letter" aria-controls="letter" aria-selected="false" tabindex="-1" data-t="tabLetter"></button>
      <button class="tab" role="tab" id="t-info" aria-controls="info" aria-selected="false" tabindex="-1" data-t="tabInfo"></button>
    </div>
  </div>
</header>

<!-- Layout only. All text comes from content.js via the data-t="…" names. -->
<main class="wrap">

  <section class="panel cv" id="cv" role="tabpanel" aria-labelledby="t-cv">
    <aside class="side">
      <div class="photo" id="photo">
        <img id="photoImg" hidden>
        <div class="empty" id="photoEmpty" data-t="photoEmpty"></div>
      </div>
      <div class="photo-actions">
        <button class="btn" id="upBtn" type="button" data-t="upload"></button>
        <button class="btn ghost" id="rmBtn" type="button" hidden data-t="remove"></button>
        <input type="file" id="file" accept="image/*" hidden>
      </div>
      <div data-t="contact"></div>
      <div data-t="skills"></div>
      <div data-t="languages"></div>
    </aside>
    <div>
      <div class="block profile" data-t="profile"></div>
      <div class="block" data-t="experience"></div>
      <div class="block" data-t="education"></div>
      <div class="block" data-t="tools"></div>
    </div>
  </section>

  <section class="panel" id="letter" role="tabpanel" aria-labelledby="t-letter" hidden>
    <article class="letter" data-t="letter"></article>
  </section>

  <section class="panel" id="info" role="tabpanel" aria-labelledby="t-info" hidden>
    <div class="grid">
      <div class="card wide" data-t="stats"></div>
      <div class="card" data-t="certifications"></div>
      <div class="card" data-t="publications"></div>
      <div class="card" data-t="accomplishments"></div>
      <div class="card" data-t="interests"></div>
      <div class="card" data-t="references"></div>
    </div>
  </section>
</main>

<footer><div class="wrap" data-t="footer"></div></footer>

<script src="content.js"></script>
<script>
/* ---------- Tabs ---------- */
const tabs=[...document.querySelectorAll('.tab')];
function show(id,focus){
  tabs.forEach(t=>{
    const on=t.getAttribute('aria-controls')===id;
    t.setAttribute('aria-selected',on);
    t.tabIndex=on?0:-1;
    document.getElementById(t.getAttribute('aria-controls')).hidden=!on;
    if(on&&focus)t.focus();
  });
  history.replaceState(null,'','#'+id);
}
tabs.forEach((t,i)=>{
  t.addEventListener('click',()=>show(t.getAttribute('aria-controls')));
  t.addEventListener('keydown',e=>{
    const k={ArrowRight:1,ArrowLeft:-1}[e.key];
    if(k){const n=tabs[(i+k+tabs.length)%tabs.length];show(n.getAttribute('aria-controls'),true);e.preventDefault()}
  });
});
const start=location.hash.slice(1);
if(['cv','letter','info'].includes(start))show(start);

/* ---------- Persistent photo ----------
   1) photo saved in this browser  2) DEFAULT_PHOTO file in the repo (optional)
   For every visitor: commit photo.jpg next to index.html and set DEFAULT_PHOTO='photo.jpg'. */
const DEFAULT_PHOTO='photo.jpg';
const KEY='cv-photo-v1';
const img=document.getElementById('photoImg'),empty=document.getElementById('photoEmpty'),
      file=document.getElementById('file'),rm=document.getElementById('rmBtn');
let lang='hu';

function render(src){
  if(src){img.src=src;img.hidden=false;empty.hidden=true;}
  else{img.hidden=true;empty.hidden=false;}
  let saved=null;try{saved=localStorage.getItem(KEY)}catch(e){}
  rm.hidden=!saved;
}
function load(){
  let saved=null;try{saved=localStorage.getItem(KEY)}catch(e){}
  render(saved||DEFAULT_PHOTO||'');
}
document.getElementById('upBtn').onclick=()=>file.click();
file.onchange=()=>{
  const f=file.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      const s=Math.min(1,700/Math.max(im.width,im.height));
      const c=document.createElement('canvas');
      c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      const data=c.toDataURL('image/jpeg',.85);
      try{localStorage.setItem(KEY,data)}catch(e){alert(T.uploadError[lang])}
      render(data);
    };
    im.src=r.result;
  };
  r.readAsDataURL(f);
};
rm.onclick=()=>{try{localStorage.removeItem(KEY)}catch(e){}load()};

/* ---------- Language: fills every [data-t] element from content.js ---------- */
function setLang(l){
  lang=l;
  document.querySelectorAll('[data-t]').forEach(el=>{
    const b=T[el.dataset.t];
    if(b&&b[l]!==undefined)el.innerHTML=b[l]; else console.warn('Missing content block:',el.dataset.t,l);
  });
  document.documentElement.lang=l;
  document.title=T.pageTitle[l];
  document.querySelector('meta[name=description]').content=T.pageDesc[l];
  img.alt=T.photoAlt[l];
  document.getElementById('tablist').setAttribute('aria-label',T.tabsLabel[l]);
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===l));
  try{localStorage.setItem('cv-lang',l)}catch(e){}
}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
let savedLang=null;try{savedLang=localStorage.getItem('cv-lang')}catch(e){}
const q=new URLSearchParams(location.search).get('lang');
setLang(q==='en'||q==='hu'?q:(savedLang||'hu'));
load();
</script>
</body>
</html>
